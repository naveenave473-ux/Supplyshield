<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Cyan Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60CDFF" />
      <stop offset="50%" stop-color="#35BFFF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shieldMetallic" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#B8E2F8" />
      <stop offset="35%" stop-color="#2D5F8A" />
      <stop offset="70%" stop-color="#0E233D" />
      <stop offset="100%" stop-color="#071324" />
    </linearGradient>

    <!-- Flame Core Gradient -->
    <linearGradient id="flameGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#B2F1FF" />
      <stop offset="30%" stop-color="#35BFFF" />
      <stop offset="75%" stop-color="#0077FF" />
      <stop offset="100%" stop-color="#0038A8" />
    </linearGradient>

    <!-- Wing Highlight -->
    <linearGradient id="flameWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8F6FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0099FF" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Deep Circular Background -->
  <circle cx="50" cy="50" r="48" fill="#060A14" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="50" cy="50" r="42" stroke="#35BFFF" stroke-width="2" stroke-opacity="0.5" filter="url(#neonGlow)" />
  <circle cx="50" cy="50" r="42" stroke="url(#ringGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="39.5" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.6" />

  <!-- Metallic Shield Outer Body -->
  <path d="M50 20L69 28.5C69 46 62 61 50 71C38 61 31 46 31 28.5L50 20Z"
        fill="url(#shieldMetallic)"
        stroke="#60CDFF"
        stroke-width="1.2"
        stroke-opacity="0.8" />

  <!-- Shield Inner Bevel Lip -->
  <path d="M50 23.5L66 30.5C66 45 59.5 58 50 67C40.5 58 34 45 34 30.5L50 23.5Z"
        fill="#0A1629"
        fill-opacity="0.8"
        stroke="rgba(255,255,255,0.25)"
        stroke-width="0.8" />

  <!-- Shield Center Division Highlight -->
  <path d="M50 23.5V67" stroke="rgba(255,255,255,0.2)" stroke-width="0.8" />

  <!-- Stylized Energy Flame Core -->
  <!-- Left Petal -->
  <path d="M43 57C40 50 41 42 45 36C45 42 47 45 49 48C46 51 44 54 43 57Z"
        fill="url(#flameWing)" />

  <!-- Right Petal -->
  <path d="M57 57C60 50 59 42 55 36C55 42 53 45 51 48C54 51 56 54 57 57Z"
        fill="url(#flameWing)" />

  <!-- Main Center Flame / Wing -->
  <path d="M50 28C53 36 58 43 58 52C58 60 54 64 50 65C46 64 42 60 42 52C42 43 47 36 50 28Z"
        fill="url(#flameGrad)"
        filter="url(#neonGlow)" />

  <!-- Internal Bright Flame Spire -->
  <path d="M50 33C51.5 39 54 44 54 50C54 55 52 58 50 59C48 58 46 55 46 50C46 44 48.5 39 50 33Z"
        fill="#E0F8FF" />
</svg>
